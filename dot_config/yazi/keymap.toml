# A TOML linter such as Tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
#:schema https://yazi-rs.github.io/schemas/keymap.json

# NOTE: This file intentionally contains ONLY your custom keybindings.
# All Yazi defaults are used as-is (do not copy the full default keymap here),
# so future upstream changes (e.g. `arrow prev/next`, `tasks:show`,
# `plugin fd/rg`, `copy dirpath`, `swipe prev/next`) apply automatically.
# `prepend_keymap` wins over defaults; `[[mgr.prepend_keymap]]` (not `manager.*`).

# ---- Custom goto bookmarks (extras not in upstream defaults) ----
[[mgr.prepend_keymap]]
on = ["g", "C"]
run = "cd ~/Coding"
desc = "Coding"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd ~/Stuff"
desc = "Stuff"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd ~/Music"
desc = "Music"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Pictures"
desc = "Pictures"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "cd ~/Videos"
desc = "Videos"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.local/share/chezmoi"
desc = "Chezmoi dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "cd ~/.local"
desc = "~/.local"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documents"
desc = "Documents"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = "cd ~/Desktop"
desc = "Desktop"

[[mgr.prepend_keymap]]
on = ["g", "G"]
run = "cd ~/Games"
desc = "Games"

[[mgr.prepend_keymap]]
on = ["g", "-"]
run = "back"
desc = "Go to previous directory"

# ---- Plugin / custom bindings (migrated) ----
[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -- -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb -- +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -- -open"
desc = "open with duckdb"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -- -ui"
desc = "open with duckdb ui"

[[mgr.prepend_keymap]]
on = ["'", ";"]
run = 'plugin custom-shell -- auto --interactive'
desc = "custom-shell as default, interactive"

[[mgr.prepend_keymap]]
on = ["'", ":"]
run = 'plugin custom-shell -- auto --interactive --block'
desc = "custom-shell as default, interactive, block"

[[mgr.prepend_keymap]]
on = "p"
run = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on = "o"
run = "plugin open-with-cmd -- block"
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on = "O"
run = "plugin open-with-cmd"
desc = "Open with command"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "F"
run = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "<C-y>"
run = [ "yank", 'plugin clipboard -- --action=copy' ]
desc = "Copy yanked files to system clipboard"

[[mgr.prepend_keymap]]
on = ["f", "j"]
run = "plugin first-non-directory"
desc = "Jumps to the first file"

[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "a", "p"]
run = "plugin compress -- -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["c", "a", "h"]
run = "plugin compress -- -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on = ["c", "a", "l"]
run = "plugin compress -- -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on = ["c", "a", "u"]
run = "plugin compress -- -phl"
desc = "Archive selected files (password+header+level)"

[[mgr.prepend_keymap]]
on = "u"
run = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on = ["w", "s"]
run = "plugin what-size"
desc = "Calc size of selection or cwd"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = "<F3>"
run = "plugin mediainfo -- toggle-metadata"
desc = "Toggle media preview metadata"

[[mgr.prepend_keymap]]
on = "<F4>"
run = "plugin mediainfo -- toggle-preview"
desc = "Toggle media preview image"

[[mgr.prepend_keymap]]
on = "W"
run = 'shell --confirm "noctalia msg wallpaper-set \"$1\""'
desc = "Set as wallpaper (Wallpapers dir)"
